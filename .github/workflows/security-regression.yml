name: Security regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PYTHONPATH: back-end
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: npm --prefix front-end ci
      - run: npm --prefix front-end run lint
      - run: npm --prefix front-end test
      - run: npm --prefix front-end run build -- --outDir ../web-build --emptyOutDir
      - run: python -m pip install -r back-end/requirements.txt pip-audit
      - run: python -m unittest discover -s back-end/tests
      - run: python -m compileall -q back-end app.py
      - run: npm --prefix front-end audit --omit=dev
      - run: pip-audit
      - name: Browser regression with no AI credentials
        run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.64.0 --no-audit --no-fund
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
          python -m uvicorn main:app --host 127.0.0.1 --port 8916 > "$RUNNER_TEMP/mathnote-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8916/api/health && break
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" node scripts/browser-smoke.cjs
      - name: Desktop package regression (not a release)
        run: |
          VITE_API_URL=http://127.0.0.1:8916 npm --prefix front-end run build:desktop
          cd front-end
          npx --no-install electron-builder --linux --x64 --dir --publish never
