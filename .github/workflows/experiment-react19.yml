name: Experiment React 19 compatibility
on:
  push:
    branches: [experiment/react19-compat-20261102]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Resolve dependencies without peer conflicts
        run: npm --prefix front-end install --ignore-scripts --no-fund
      - run: npm --prefix front-end ci --ignore-scripts --no-fund
      - run: npm --prefix front-end ls react react-dom @types/react @types/react-dom
      - run: npm --prefix front-end audit
      - run: npm --prefix front-end run lint
      - run: npm --prefix front-end test
      - run: npm --prefix front-end run build
      - run: node scripts/proxy-download-regression.cjs
      - name: Commit validated lockfile
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add front-end/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(deps): lock validated React 19 dependencies'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push "https://github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/experiment/react19-compat-20261102"
